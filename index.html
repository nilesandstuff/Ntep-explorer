const CK = "ntep_v5_";

/* ── cache ─────────────────────────────────────────────────────────── */
function cget(id){
  try{const r=localStorage.getItem(CK+id);if(!r)return null;
    const o=JSON.parse(r);
    if(Date.now()-o.ts>30*86400000){localStorage.removeItem(CK+id);return null;}
    return o;
  }catch(_){return null;}
}
function cset(id,d){try{localStorage.setItem(CK+id,JSON.stringify({data:d,ts:Date.now()}));}catch(_){}}
function cdel(id){try{localStorage.removeItem(CK+id);}catch(_){}}
function chas(id){return cget(id)!==null;}
function cage(ms){
  const d=Math.floor(ms/86400000),h=Math.floor(ms/3600000),m=Math.floor(ms/60000);
  return d>=1?d+"d ago":h>=1?h+"h ago":m>=1?m+"m ago":"just now";
}


/* ── UMN loader ────────────────────────────────────────────────────── */
async function loadFromProxy(id, trial, onProg){
  onProg&&onProg({msg:"Querying database...",pct:10});
  const r=await fetch(PROXY+"?action=load_trial&trial_id="+id,{cache:"no-store"});
  if(!r.ok) throw new Error("Proxy HTTP "+r.status);
  const j=await r.json();
  if(j.error) throw new Error(j.error);
  if(!j.cultivars||j.cultivars.length===0) throw new Error("No UMN data for "+id+"all");
  onProg&&onProg({msg:"Loaded "+j.cultivars.length+" cultivars loaded",pct:100});
  return{...j, trialLabel:trial.label, species:trial.species, dataYears:trial.years};
}

async function proxyTest(){
  try{
    const r=await fetch(PROXY+"?action=load_trial&trial_id=ff14",{cache:"no-store"});
    if(!r.ok) return{ok:false,msg:"HTTP "+r.status};
    const j=await r.json();
    if(j.error) return{ok:false,msg:"Error: "+j.error};
    return{ok:true,msg:"OK - "+j.cultivars.length+" cultivars loaded (2014 Fineleaf Fescue)"};
  }catch(e){return{ok:false,msg:"FAIL: "+e.message};}
}

/* ── UI helpers ────────────────────────────────────────────────────── */
function sc(v){return v>=7?"#22c55e":v>=6?"#84cc16":v>=5?"#eab308":v>=4?"#f97316":"#ef4444";}

function ScoreBar({value,compact}){
  return (
    <div style={{display:"flex",alignItems:"center",gap:"6px",width:"100%"}}>
      <div style={{flex:1,background:"#0f172a",borderRadius:"4px",height:compact?"5px":"8px",overflow:"hidden"}}>
        <div style={{width:Math.min(100,value/9*100)+"%",height:"100%",background:sc(value),borderRadius:"4px"}}/>
      </div>
      {!compact && <span style={{fontSize:"13px",fontWeight:700,color:sc(value),minWidth:"28px",textAlign:"right"}}>{value.toFixed(1)}</span>}
    </div>
  );
}

function Rank({rank,total}){
  const p=rank/total;
  const bg=p<=0.25?"#16a34a":p<=0.5?"#65a30d":p<=0.75?"#d97706":"#dc2626";
  return <span style={{background:bg,color:"#fff",borderRadius:"999px",fontSize:"10px",fontWeight:700,padding:"2px 6px",whiteSpace:"nowrap"}}>#{rank}/{total}</span>;
}

function Tag({text,bg="#334155"}){
  return <span style={{background:bg,color:"#fff",borderRadius:"4px",fontSize:"10px",fontWeight:600,padding:"2px 5px",whiteSpace:"nowrap"}}>{text}</span>;
}

function Pill({active,onClick,label}){
  return (
    <button onClick={onClick} style={{padding:"3px 8px",borderRadius:"5px",fontSize:"11px",fontWeight:600,cursor:"pointer",border:active?"2px solid #22c55e":"1px solid #334155",background:active?"rgba(34,197,94,.1)":"#0f172a",color:active?"#22c55e":"#64748b"}}>
      {label}
    </button>
  );
}

function getRanks(cultivars,vk,site){
  let sc2=cultivars.map(c=>({name:c.name,v:c.vars[vk]?.[site]??null})).filter(x=>x.v!==null);
  const fb=sc2.length===0&&site!=="MEAN";
  if(fb) sc2=cultivars.map(c=>({name:c.name,v:c.vars[vk]?.MEAN??null})).filter(x=>x.v!==null);
  sc2.sort((a,b)=>b.v-a.v);
  const r={}; sc2.forEach((c,i)=>r[c.name]=i+1);
  return{r,total:sc2.length,fb};
}

function isTop(val,all,lsd){
  return lsd&&all.length>0?(Math.max(...all)-val)<=lsd:false;
}

  const saveOverrides=(ov)=>{
    setOverrides(ov);
    try{localStorage.setItem("ntep_sf_v3",JSON.stringify(ov));}catch(_){}
  };

  const go=useCallback(async(id,force=false)=>{
    const trial=TRIALS.find(t=>t.id===id);
    if(!trial) return;
    setSelId(id); setPinned(null); setCompared([]); setSite("MEAN");
    setCvSearch(""); setErrMsg(""); setPtRes(null);
    setSfDraft(overrides[id]||"");

    if(!force){
      const hit=cget(id);
      if(hit){
        setData(hit.data); setCacheAge(Date.now()-hit.ts);
        setSelVars([hit.data.vars[0]||"QUALITY Overall"]);
        setSortV(hit.data.vars[0]||"QUALITY Overall");
        setView("trial"); setTab("trial"); return;
      }
    }

    setView("loading"); setTab("trial"); setProg({msg:"Starting...",pct:0});

    try{
      const d=await loadFromProxy(id,trial,p=>setProg(p));
      cset(id,d); setData(d); setCacheAge(null);
      setSelVars([d.vars[0]||"QUALITY Overall"]);
      setSortV(d.vars[0]||"QUALITY Overall");
      setView("trial");
    }catch(e){
      if(DEMO[id]){
        setData(DEMO[id]); setCacheAge(null);
        setSelVars(["QUALITY Overall"]); setSortV("QUALITY Overall");
        setView("trial");
        setErrMsg("Live load failed — showing demo data.\n"+e.message);
      } else {
        setErrMsg(e.message); setView("error");
      }
    }
  },[overrides]);

  /* filtered + sorted cultivars */
  const filtered=useMemo(()=>{
    if(!data) return [];
    let list=data.cultivars;
    if(!showNC) list=list.filter(c=>c.ca);
    if(cvSearch.trim()){const q=cvSearch.toLowerCase();list=list.filter(c=>c.name.toLowerCase().includes(q));}
    return [...list].sort((a,b)=>(b.vars[sortV]?.[site]??-1)-(a.vars[sortV]?.[site]??-1));
  },[data,showNC,cvSearch,sortV,site]);

  const displayed=useMemo(()=>{
    if(!pinned) return filtered;
    const p=filtered.find(c=>c.name===pinned);
    return p?[p,...filtered.filter(c=>c.name!==pinned)]:filtered;
  },[filtered,pinned]);

  /* global cultivar search results */
  const globResults=useMemo(()=>{
    const q=globQ.trim().toLowerCase();
    if(q.length<2) return [];
    return Object.entries(CIDX).filter(([n])=>n.toLowerCase().includes(q));

  /* AI */

    if(!aiQ.trim()) return;
    setAiLoad(true); setAiR("");
    try{
      const ctx=data
        ?"Trial: "+data.trialLabel+". Top: "+data.cultivars.slice(0,5).map(c=>c.name+"="+(c.vars["QUALITY Overall"]?.MEAN??"-")).join(", ")
