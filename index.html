/* ── cache ─────────────────────────────────────────────────────────── */
function cget(id){
  try{const r=localStorage.getItem(CK+id);if(!r)return null;
    const o=JSON.parse(r);
    if(Date.now()-o.ts>30*60*1000){localStorage.removeItem(CK+id);return null;}
    return o;
  }catch(_){return null;}
}
function cset(id,d){try{localStorage.setItem(CK+id,JSON.stringify({data:d,ts:Date.now()}));}catch(_){}}
function cdel(id){try{localStorage.removeItem(CK+id);}catch(_){}}
function chas(id){return cget(id)!==null;}
function cage(ms){
  const d=Math.floor(ms/86400000),h=Math.floor(ms/3600000),m=Math.floor(ms/60000);
  return d>=1?d+"d ago":h>=1?h+"h ago":m>=1?m+"m ago":"just now";
}


/* ── UMN loader ────────────────────────────────────────────────────── */
async function loadFromProxy(id, trial, onProg, force=false){
  onProg&&onProg({msg:"Fetching NTEP trial data...",pct:10});
  const r=await fetch(PROXY+"?action=load_trial&trial_id="+id+(force?"&force=1":"")+"&label="+encodeURIComponent(trial.label||id),{cache:"no-store"});
  if(!r.ok) throw new Error("Proxy HTTP "+r.status);
  const j=await r.json();
  if(j.error) throw new Error(j.error);
  if(!j.cultivars||j.cultivars.length===0) throw new Error("No UMN data for "+id+"all");
  onProg&&onProg({msg:"Loaded "+j.cultivars.length+" cultivars from NTEP",pct:100});
  return{...j, trialLabel:trial.label, species:trial.species, dataYears:trial.years};
}

async function proxyTest(){
  try{
    const r=await fetch(PROXY+"?action=load_trial&trial_id=ff14",{cache:"no-store"});
    if(!r.ok) return{ok:false,msg:"HTTP "+r.status};
    const j=await r.json();
    if(j.error) return{ok:false,msg:"Error: "+j.error};
    return{ok:true,msg:"OK - "+j.cultivars.length+" cultivars loaded (2014 Fineleaf Fescue via NTEP)"};
  }catch(e){return{ok:false,msg:"FAIL: "+e.message};}
}

/* ── UI helpers ────────────────────────────────────────────────────── */
function sc(v){return v>=7?"#22c55e":v>=6?"#84cc16":v>=5?"#eab308":v>=4?"#f97316":"#ef4444";}

function ScoreBar({value,compact}){
  return (
    <div style={{display:"flex",alignItems:"center",gap:"6px",width:"100%"}}>
      <div style={{flex:1,background:"#0f172a",borderRadius:"4px",height:compact?"5px":"8px",overflow:"hidden"}}>
        <div style={{width:Math.min(100,value/9*100)+"%",height:"100%",background:sc(value),borderRadius:"4px"}}/>
      </div>
      {!compact && <span style={{fontSize:"13px",fontWeight:700,color:sc(value),minWidth:"28px",textAlign:"right"}}>{value.toFixed(1)}</span>}
    </div>
  );
}

function Rank({rank,total}){
  const p=rank/total;
  const bg=p<=0.25?"#16a34a":p<=0.5?"#65a30d":p<=0.75?"#d97706":"#dc2626";
  return <span style={{background:bg,color:"#fff",borderRadius:"999px",fontSize:"10px",fontWeight:700,padding:"2px 6px",whiteSpace:"nowrap"}}>#{rank}/{total}</span>;
}

function Tag({text,bg="#334155"}){
  return <span style={{background:bg,color:"#fff",borderRadius:"4px",fontSize:"10px",fontWeight:600,padding:"2px 5px",whiteSpace:"nowrap"}}>{text}</span>;
}

function Pill({active,onClick,label}){
  return (
    <button onClick={onClick} style={{padding:"3px 8px",borderRadius:"5px",fontSize:"11px",fontWeight:600,cursor:"pointer",border:active?"2px solid #22c55e":"1px solid #334155",background:active?"rgba(34,197,94,.1)":"#0f172a",color:active?"#22c55e":"#64748b"}}>
      {label}
    </button>
  );
}

function getRanks(cultivars,vk,site){
  let sc2=cultivars.map(c=>({name:c.name,v:c.vars[vk]?.[site]??null})).filter(x=>x.v!==null);
  const fb=sc2.length===0&&site!=="MEAN";
  if(fb) sc2=cultivars.map(c=>({name:c.name,v:c.vars[vk]?.MEAN??null})).filter(x=>x.v!==null);
  sc2.sort((a,b)=>b.v-a.v);
  const r={}; sc2.forEach((c,i)=>r[c.name]=i+1);
  return{r,total:sc2.length,fb};
}

function isTop(val,all,lsd){
  return lsd&&all.length>0?(Math.max(...all)-val)<=lsd:false;
}

  },

  }
};
const decodeSite = (field, val) => {
  if(val===null||val===undefined||val==='') return null;
  const lk = SITE_LOOKUPS[field];
  return lk ? (lk[String(val)] || val) : val;
};

function SiteConditionCard({siteCode, trialId}) {
  const [open,    setOpen]    = useState(false);
  const [siteData,setSiteData]= useState(null);
  const [loading, setLoading] = useState(true);
  const [err,     setErr]     = useState(null);

  useEffect(()=>{
    setLoading(true); setErr(null); setSiteData(null);
    fetch(PROXY+'?action=site_conditions&trial_id='+trialId,{cache:'no-store'})
      .then(r=>r.json())
      .then(d=>{
        if(d.error){setErr(d.error);}
        else{setSiteData(d[siteCode]||null);}
        setLoading(false);
      })
      .catch(e=>{setErr(e.message);setLoading(false);});
  },[trialId, siteCode]);

  const years = siteData ? Object.keys(siteData.years).sort() : [];

  return (
    <div style={{background:'#1e293b',borderRadius:'8px',border:'1px solid #334155',marginBottom:'6px',overflow:'hidden'}}>
      {/* Header — always visible */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'9px 12px'}}>
        <div>
          <span style={{fontWeight:700,fontSize:'12px',color:'#f1f5f9'}}>{siteCode}</span>
          {siteData&&<span style={{fontSize:'11px',color:'#64748b',marginLeft:'7px'}}>{siteData.name}</span>}
        </div>
        <button onClick={()=>setOpen(o=>!o)}
          style={{background:'none',border:'none',color:'#64748b',cursor:'pointer',fontSize:'11px',display:'flex',alignItems:'center',gap:'4px',padding:'2px 0'}}>
          {loading?'Loading...'
            :err?<span style={{color:'#ef4444'}}>Unavailable</span>
            :!siteData?<span style={{color:'#475569'}}>No data</span>
            :<>{open?'Hide site conditions ▲':'Show site conditions ▼'}</>}
        </button>
      </div>
      {/* Expanded content */}
      {open&&siteData&&(
        <div style={{overflowX:'auto',borderTop:'1px solid #334155'}}>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:'11px',minWidth:'260px'}}>
            <thead>
              <tr style={{background:'#0f172a'}}>
                <th style={{textAlign:'left',padding:'5px 10px',color:'#475569',fontWeight:600,whiteSpace:'nowrap'}}></th>
                {years.map(y=>(
                  <th key={y} style={{textAlign:'center',padding:'5px 10px',color:'#94a3b8',fontWeight:600,whiteSpace:'nowrap'}}>
                    {years.length>1?("'"+String(y).slice(-2)):y}
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>
              {SITE_ROWS.map(([key,label])=>{
                const vals = years.map(y=>siteData.years[y]?.[key]);
                if(vals.every(v=>!v)) return null;
                return (
                  <tr key={key} style={{borderTop:'1px solid #1e293b'}}>
                    <td style={{padding:'5px 10px',color:'#64748b',whiteSpace:'nowrap',fontWeight:500}}>{label}</td>
                    {vals.map((v,i)=>{
                      const decoded = decodeSite(key, v);
                      return (
                        <td key={i} style={{padding:'5px 10px',textAlign:'center',color:'#e2e8f0',
                          maxWidth:'160px',overflowWrap:'break-word',wordBreak:'break-word'}}>
                          {decoded!==null ? decoded : <span style={{color:'#334155'}}>—</span>}
                        </td>
                      );
                    })}
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

  'SOD STRENGTH':'Sod Str.','MOWING QUALITY':'Mow.Q','VERTICAL GROWTH':'V.Growth',
  'INSECT Rating':'Insects','INSECTS Sod webworm':'Webworm','INSECTS Billbugs':'Billbugs',
  'INSECTS Chinch bug':'Chinch','INSECTS Aphids':'Aphids','INSECTS White grub':'W.Grub',
  'DISEASES Dead spot':'Dead Sp.','DISEASES Dollar spot':'D.Spot',
  'DISEASES Necrotic ring spot':'NRS','DISEASES Brown patch (warm)':'B.P.Warm',
  'DISEASES Brown patch (cool)':'B.P.Cool','DISEASES Crown rust':'Cr.Rust',
  'DISEASES Gray leaf spot':'G.L.Spot','DISEASES Pythium blight':'Pythium',
  'DISEASES Typhula blight':'Typhula','DISEASES Fusarium patch':'Fus.Patch',
  'DISEASES Melting-out spring':'M.O.Spr','DISEASES Melting-out fall':'M.O.Fall',
  'DISEASES Anthracnose':'Anthrac.','DISEASES Summer patch':'S.Patch',
  'DISEASES Leaf spot':'L.Spot','DISEASES Stem rust':'St.Rust',
  'DISEASES Red thread':'R.Thread','DISEASES Stripe smut':'Str.Smut',
  'DISEASES Powdery mildew':'P.Mildew','DISEASES Fusarium blight':'Fus.Bl.',
  'DISEASES Leaf rust':'L.Rust','DISEASES Pink snow mold':'P.S.Mold',
  'DISEASES Snow mold':'Sn.Mold','DISEASES Pink patch':'P.Patch',
  'DISEASES Microdochium patch':'Micro.P','DISEASES Take-all patch':'T.A.Patch',
  'DISEASES Pythium root rot':'Py.Rot','DISEASES Fairy ring':'F.Ring',
  'DISEASES Damping off':'Damp.Off','DISEASES Flag smut':'Fl.Smut',
  'PERCENT Leaf spot':'LS%','PERCENT Leaf disease':'LD%','PERCENT Patch disease':'PD%',
  'PERCENT Dollar spot':'DS%','PERCENT Brown patch':'BP%',
  'PERCENT Typhula blight':'TB%','PERCENT Red thread':'RT%',
  'PERCENT Establishment':'Est%','GROUND COVER Spring':'GC.Spr',
  'GROUND COVER Summer':'GC.Sum','GROUND COVER Fall':'GC.Fall',
};
function cmpLabel(v){ return CMP_ABBR[v] || v.split(' ').pop(); }

/* ── App ─────────────────────────────────────────────────────────────── */
function App(){
  const [tab,setTab]         = useState("trial");
  const [view,setView]       = useState("list");   /* list|loading|trial|error */
  const [selId,setSelId]     = useState(null);
  const [prog,setProg]       = useState({msg:"",pct:0});
  const [errMsg,setErrMsg]   = useState("");
  const [data,setData]       = useState(null);
  const [cacheAge,setCacheAge]=useState(null);
  const [selVars,setSelVars] = useState(["QUALITY Overall"]);
  const [sortV,setSortV]     = useState("QUALITY Overall");
  const [site,setSite]       = useState("MEAN");
  const [cvSearch,setCvSearch]= useState("");
  const [showNC,setShowNC]   = useState(false);
  const [compared,setCompared]= useState([]);
  const [expanded,setExpanded] = useState(null);
  const [cmpSort,setCmpSort]   = useState({v:null,dir:"desc"});


  const [globQ,setGlobQ]       = useState("");
  const [globResults,setGlobResults] = useState([]);
  const [globLoading,setGlobLoading] = useState(false);
  const [selSp,setSelSp]     = useState(null);

  const [tSearch,setTSearch] = useState("");
  const scrollRef = useRef(null);



  const go=useCallback(async(id,force=false)=>{
    const trial=TRIALS.find(t=>t.id===id);
    if(!trial) return;
    setSelId(id); setCompared([]); setSite("MEAN");
    setCvSearch(""); setErrMsg(""); 

    if(!force){
      const hit=cget(id);
      if(hit){
        setData(hit.data); setCacheAge(Date.now()-hit.ts);
        setSelVars([hit.data.vars[0]||"QUALITY Overall"]);
        setSortV(hit.data.vars[0]||"QUALITY Overall");
        setView("trial"); setTab("trial"); return;
      }
    }

    setView("loading"); setTab("trial"); setProg({msg:"Starting...",pct:0});

    try{
      const d=await loadFromProxy(id,trial,p=>setProg(p),force);
      cset(id,d); setData(d); setCacheAge(null);
      setSelVars([d.vars[0]||"QUALITY Overall"]);
      setSortV(d.vars[0]||"QUALITY Overall");
      setView("trial");
    }catch(e){
      if(DEMO[id]){
        setData(DEMO[id]); setCacheAge(null);
        setSelVars(["QUALITY Overall"]); setSortV("QUALITY Overall");
        setView("trial");
        setErrMsg("Live load failed — showing demo data.\n"+e.message);
      } else {
        setErrMsg(e.message); setView("error");
      }
    }
  },[]);

  /* Debounced cultivar search against Drive index */
  useEffect(()=>{
    if(globQ.trim().length < 2){ setGlobResults([]); setGlobLoading(false); return; }
    setGlobLoading(true);
    const timer = setTimeout(()=>{
      fetch(PROXY+'?action=cultivar_search&q='+encodeURIComponent(globQ.trim()),{cache:'no-store'})
        .then(r=>r.json())
        .then(data=>{ setGlobResults(Array.isArray(data)?data:[]); setGlobLoading(false); })
        .catch(()=>{ setGlobResults([]); setGlobLoading(false); });
    }, 350);
    return ()=>clearTimeout(timer);
  },[globQ]);

  /* filtered + sorted cultivars */
  const filtered=useMemo(()=>{
    if(!data) return [];
    let list=data.cultivars;
    if(!showNC) list=list.filter(c=>c.ca);
    if(cvSearch.trim()){const q=cvSearch.toLowerCase();list=list.filter(c=>c.name.toLowerCase().includes(q));}
    return [...list].sort((a,b)=>(b.vars[sortV]?.[site]??-1)-(a.vars[sortV]?.[site]??-1));
  },[data,showNC,cvSearch,sortV,site]);



  /* trial list */
  const trialList=useMemo(()=>{
    if(!tSearch.trim()) return TRIALS;
    const q=tSearch.toLowerCase();
    return TRIALS.filter(t=>t.label.toLowerCase().includes(q)||t.species.toLowerCase().includes(q));
  },[tSearch]);




  /* Cross-trial history — queries Drive index via proxy */
  function CrossTrialHistory({name, currentVar}) {
    const [rows, setRows] = useState(null);
    const [err, setErr]   = useState(null);
    useEffect(()=>{
      setRows(null); setErr(null);
      const varParam = currentVar !== 'QUALITY Overall' ? '&var=' + encodeURIComponent(currentVar) : '';
      fetch(PROXY + '?action=cultivar_history&name=' + encodeURIComponent(name) + varParam, {cache:'no-store'})
        .then(r => r.json())
        .then(data => {
          if (data.error) { setErr(data.error); return; }
          setRows(Array.isArray(data) ? data.filter(r => r.trialId !== selId) : []);
        })
        .catch(e => setErr(e.message));
    }, [name, currentVar]);

    const sc2 = v => v>=7?"#22c55e":v>=6?"#84cc16":v>=5?"#eab308":"#ef4444";
    if (err) return <div style={{color:'#ef4444',fontSize:'11px',padding:'6px 0'}}>Error: {err}</div>;
    if (!rows) return <div style={{color:'#475569',fontSize:'11px',padding:'6px 0'}}>Loading cross-trial history...</div>;
    if (rows.length === 0) return (
      <div style={{color:'#475569',fontSize:'11px',padding:'6px 0'}}>
        This cultivar has not been found in any other cached trials yet. Load more trials to build the index.
      </div>
    );
    return (
      <div style={{marginTop:'8px'}}>
        <div style={{fontSize:'10px',fontWeight:700,color:'#94a3b8',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:'5px'}}>
          In other trials
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:'4px'}}>
          {rows.map(r=>(
            <div key={r.trialId} style={{background:'#0f172a',borderRadius:'6px',padding:'7px 10px',fontSize:'11px'}}>
              <div style={{fontWeight:600,color:'#cbd5e1',marginBottom:'4px',overflowWrap:'break-word',wordBreak:'break-word',maxWidth:'100%',lineHeight:'1.4'}}>
                {(TRIALS.find(t=>t.id===r.trialId)||{}).label||r.trialLabel||r.trialId}
              </div>
              <div style={{display:'flex',gap:'10px',flexWrap:'wrap'}}>
                {r.qMean!=null && (
                  <span>
                    <span style={{color:'#475569'}}>Quality: </span>
                    <span style={{fontWeight:700,color:sc2(r.qMean)}}>{r.qMean.toFixed(1)}</span>
                    {r.qRank!=null && <span style={{color:'#475569'}}> #{r.qRank}/{r.qTotal}</span>}
                  </span>
                )}
                {currentVar!=='QUALITY Overall' && (
                  <span>
                    <span style={{color:'#475569'}}>{CMP_ABBR[currentVar]||currentVar.split(' ').slice(-1)[0]}: </span>
                    {r.varMean!=null
                      ? <><span style={{fontWeight:700,color:sc2(r.varMean)}}>{r.varMean.toFixed(1)}</span>
                          {r.varRank!=null && <span style={{color:'#475569'}}> #{r.varRank}/{r.varTotal}</span>}</>
                      : <span style={{color:'#334155',fontStyle:'italic'}}>N/A</span>
                    }
                  </span>
                )}
              </div>
            </div>
          ))}
        </div>
      </div>
    );
  }

  /* CultivarCard — defined as a regular function inside App so it has closure */
  function CultivarCard({c}){
        const ic=compared.includes(c.name);
    const allMeans=data.cultivars.map(x=>x.vars[sortV]?.[site]).filter(Boolean);
    const lsd=data.lsds?.[sortV]||0;
    const topGrp=isTop(c.vars["QUALITY Overall"]?.[site],allMeans,lsd);
    return (
      <div style={{background:"#1e293b",borderRadius:"9px",padding:"11px 12px",marginBottom:"6px",
        border:ic?"2px solid #3b82f6":"1px solid #334155"}}>
        <div style={{display:"flex",justifyContent:"space-between",gap:"7px",marginBottom:"7px"}}>
          <div style={{flex:1,minWidth:0}}>
            <div style={{display:"flex",alignItems:"center",gap:"5px",flexWrap:"wrap"}}>
  <span style={{fontWeight:700,fontSize:"13px",color:"#f1f5f9",wordBreak:"break-word"}}>{c.name}</span>
              {topGrp&&<Tag text="Top Group" bg="#15803d"/>}
              {!c.ca&&<Tag text="NC" bg="#475569"/>}
            </div>
            {(()=>{
              const {r,total,fb}=getRanks(data.cultivars,sortV,site);
              if(!total) return null;
              return <div style={{fontSize:"10px",color:"#475569",marginTop:"2px"}}>
                Rank ({sortV.split(" ").pop()}){fb?" (mean)":""}: <Rank rank={r[c.name]||1} total={total}/>
              </div>;
            })()}
          </div>
          <div style={{display:"flex",gap:"3px",flexShrink:0}}>

            <button onClick={()=>setCompared(p=>ic?p.filter(x=>x!==c.name):[...p,c.name])}
              style={{background:ic?"#0f2337":"#0f172a",border:"1px solid",borderColor:ic?"#3b82f6":"#334155",
                color:ic?"#60a5fa":"#475569",borderRadius:"5px",padding:"4px 7px",cursor:"pointer",fontSize:"11px",fontWeight:600}}>
              Cmp
            </button>
          </div>
        </div>
        {selVars.map(vk=>{
          const val=c.vars[vk]?.[site]??(site!=="MEAN"?c.vars[vk]?.MEAN:null);
          if(val==null) return null;
          const {r,total,fb}=getRanks(data.cultivars,vk,site);
          return (
            <div key={vk} style={{marginBottom:"5px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"2px"}}>
                <span style={{fontSize:"10px",color:"#94a3b8"}}>{vk.replace("DISEASES ","D: ")}{fb&&<span style={{color:"#475569"}}> (mean)</span>}</span>
                <div style={{display:"flex",alignItems:"center",gap:"4px"}}>
                  {total>0&&r[c.name]&&<Rank rank={r[c.name]} total={total}/>}
                  <span style={{fontSize:"13px",fontWeight:700,color:sc(val)}}>{val.toFixed(1)}</span>
                </div>
              </div>
              <ScoreBar value={val}/>
            </div>
          );
        })}
        {data.sites.length>2&&selVars.length>0&&(
          <details style={{marginTop:"6px"}}>
            <summary style={{fontSize:"10px",color:"#475569",cursor:"pointer",userSelect:"none"}}>All site scores</summary>
            <div style={{marginTop:"5px",display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(58px,1fr))",gap:"3px"}}>
              {data.sites.filter(s=>s!=="MEAN").map(s=>{
                const v=c.vars[selVars[0]]?.[s];
                if(v==null) return null;
                return (
                  <div key={s} style={{background:"#0f172a",borderRadius:"5px",padding:"3px 5px",textAlign:"center"}}>
                    <div style={{fontSize:"9px",color:"#475569"}}>{s}</div>
                    <div style={{fontSize:"12px",fontWeight:700,color:sc(v)}}>{v.toFixed(1)}</div>
                    <ScoreBar value={v} compact/>
                  </div>
                );
              })}
            </div>
          </details>
        )}
        <button onClick={()=>handleExpand(c.name)}
          style={{marginTop:"7px",width:"100%",background:"transparent",border:"1px solid #334155",color:"#64748b",borderRadius:"5px",padding:"4px",fontSize:"10px",cursor:"pointer",textAlign:"center"}}>
          {expanded===c.name?"Hide cross-trial history":"Show in other trials"}
        </button>
        {expanded===c.name&&<CrossTrialHistory name={c.name} currentVar={sortV}/>}
      </div>
    );
  }

  const handleExpand = useCallback((name)=>{
    const el = scrollRef.current;
    const top = el ? el.scrollTop : 0;
    setExpanded(p => p===name ? null : name);
    if (el) requestAnimationFrame(()=>{ el.scrollTop = top; });
  }, []);

  const PAD={padding:"13px",maxWidth:"880px",margin:"0 auto"};

  return (
    <div style={{background:"#0f172a",color:"#e2e8f0",minHeight:"100dvh",display:"flex",flexDirection:"column"}}>


      {/* Header */}
      <header style={{background:"linear-gradient(135deg,#1e3a5f,#0d2137)",borderBottom:"2px solid #22c55e",padding:"10px 14px",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",gap:"9px"}}>
          <div style={{width:"26px",height:"26px",background:"#22c55e",borderRadius:"6px",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,color:"#000",fontSize:"14px",flexShrink:0}}>N</div>
          <div>
            <div style={{fontWeight:800,fontSize:"15px",color:"#fff",lineHeight:1}}>NTEP Explorer</div>
            <div style={{fontSize:"10px",color:"#22c55e",marginTop:"1px"}}>NTEP data</div>
          </div>
        </div>
        <div style={{display:"flex",gap:"6px"}}>
        </div>
      </header>


      {/* Tabs */}
      <div style={{display:"flex",background:"#1e293b",borderBottom:"1px solid #334155",flexShrink:0}}>
        {[["trial","By Trial"],["cultivar","By Cultivar"],["species","By Species"]].map(([id,lbl])=>(
          <button key={id} onClick={()=>setTab(id)} style={{flex:1,padding:"10px 5px",background:tab===id?"#0f172a":"transparent",color:tab===id?"#22c55e":"#64748b",border:"none",borderBottom:tab===id?"2px solid #22c55e":"2px solid transparent",cursor:"pointer",fontSize:"11px",fontWeight:tab===id?700:500}}>
            {lbl}
          </button>
        ))}
      </div>

      {/* Scrollable content */}
      <div ref={scrollRef} style={{flex:1,overflowY:"auto",overflowX:"hidden"}}>

        {/* ═══ BY TRIAL ═══ */}
        {tab==="trial"&&(
          <div style={PAD}>

            {/* List */}
            {view==="list"&&(
              <div>
                <input value={tSearch} onChange={e=>setTSearch(e.target.value)} placeholder="Search trials..."
                  style={{width:"100%",background:"#1e293b",border:"1px solid #334155",color:"#e2e8f0",borderRadius:"8px",padding:"11px 13px",fontSize:"14px",outline:"none",boxSizing:"border-box",marginBottom:"12px"}}/>
                {SPECIES.map(sp=>{
                  const ts=trialList.filter(t=>t.species===sp);
                  if(!ts.length) return null;
                  return (
                    <div key={sp} style={{marginBottom:"12px"}}>
                      <div style={{fontSize:"10px",fontWeight:700,color:"#475569",textTransform:"uppercase",letterSpacing:".7px",marginBottom:"4px"}}>{sp}</div>
                      {ts.map(t=>(
                        <button key={t.id} onClick={()=>go(t.id)}
                          style={{width:"100%",background:"#1e293b",border:"1px solid #334155",color:"#e2e8f0",borderRadius:"8px",padding:"10px 12px",textAlign:"left",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"3px",fontSize:"13px"}}>
                          <span style={{flex:1}}>{t.label}</span>
                          {chas(t.id)&&<Tag text="cached" bg="#1e3a5f"/>}
                        </button>
                      ))}
                    </div>
                  );
                })}
              </div>
            )}

            {/* Loading */}
            {view==="loading"&&(
              <div style={{padding:"40px 16px",textAlign:"center"}}>
                <div style={{fontSize:"14px",color:"#94a3b8",marginBottom:"14px"}}>{prog.msg||"Loading..."}</div>
                <div style={{background:"#1e293b",borderRadius:"999px",height:"8px",overflow:"hidden",maxWidth:"320px",margin:"0 auto"}}>
                  <div style={{width:(prog.pct||40)+"%",height:"100%",background:"#22c55e",borderRadius:"999px",transition:"width .3s"}}/>
                </div>
              </div>
            )}

            {/* Error */}
            {view==="error"&&(
              <div>
                <div style={{background:"#1c0909",border:"1px solid #7f1d1d",borderRadius:"9px",padding:"14px",fontSize:"12px",color:"#fca5a5",lineHeight:"1.7",whiteSpace:"pre-wrap",marginBottom:"10px"}}>
                  {errMsg}
                </div>
                <div style={{display:"flex",gap:"8px"}}>
            <button onClick={()=>{setView("list");setErrMsg("");}} style={{background:"#334155",border:"none",color:"#94a3b8",borderRadius:"6px",padding:"7px 12px",fontSize:"12px",fontWeight:600,cursor:"pointer"}}>Back</button>
                </div>
              </div>
            )}

            {/* Trial loaded */}
            {view==="trial"&&data&&(
              <div>
                {/* Demo / live error notice */}
                {errMsg&&(
                  <div style={{background:"#1c0f00",border:"1px solid #92400e",borderRadius:"7px",padding:"9px",fontSize:"11px",color:"#fcd34d",marginBottom:"10px",lineHeight:"1.6"}}>
                    {errMsg}
                  </div>
                )}

                {/* Header row */}
                <div style={{display:"flex",gap:"9px",marginBottom:"11px",alignItems:"flex-start"}}>
                  <button onClick={()=>{setView("list");setData(null);setErrMsg("");setCvSearch("");setCompared([]);setCacheAge(null);setTSearch("");}}
                    style={{background:"#1e293b",border:"1px solid #334155",color:"#94a3b8",borderRadius:"7px",padding:"7px 10px",cursor:"pointer",fontSize:"12px",flexShrink:0}}>Back</button>
                  <div style={{flex:1}}>
                    <div style={{display:"flex",alignItems:"center",gap:"6px",flexWrap:"wrap"}}>
                      <span style={{fontWeight:800,fontSize:"14px",color:"#fff"}}>{data.trialLabel||data.trialId}</span>
                      {cacheAge!=null&&<Tag text={"Cached "+cage(cacheAge)} bg="#1e3a5f"/>}
                      {data._demo&&<Tag text="Demo data" bg="#78350f"/>}
                      {data.hits&&!data._demo&&<Tag text={"Live — "+data.hits+" tables"} bg="#166534"/>}
                    </div>
                    <div style={{fontSize:"11px",color:"#475569",marginTop:"2px"}}>{data.cultivars.length} cultivars{data.dataYears?" — "+data.dataYears:""}{data.sf?" — subfolder: "+data.sf:""}</div>
                    <button onClick={()=>{cdel(selId);go(selId,true);}}
                      style={{marginTop:"5px",background:"transparent",border:"1px solid #334155",color:"#64748b",borderRadius:"5px",padding:"3px 9px",fontSize:"10px",cursor:"pointer"}}>Refresh from NTEP</button>
                  </div>
                </div>

                {/* Controls */}
                <div style={{background:"#1e293b",borderRadius:"9px",padding:"11px",marginBottom:"10px"}}>
                  <input value={cvSearch} onChange={e=>setCvSearch(e.target.value)} placeholder="Filter cultivars..."
                    style={{width:"100%",background:"#0f172a",border:"1px solid #334155",color:"#e2e8f0",borderRadius:"7px",padding:"8px 10px",fontSize:"13px",outline:"none",boxSizing:"border-box",marginBottom:"9px"}}/>
                  <div style={{marginBottom:"8px"}}>
                    <div style={{fontSize:"10px",color:"#475569",fontWeight:700,textTransform:"uppercase",letterSpacing:".5px",marginBottom:"4px"}}>Site</div>
                    <div style={{display:"flex",gap:"4px",flexWrap:"wrap"}}>
                      {data.sites.map(s=><Pill key={s} active={site===s} onClick={()=>setSite(s)} label={s}/>)}
                    </div>
                  </div>
                  <div style={{marginBottom:"8px"}}>
                    <div style={{fontSize:"10px",color:"#475569",fontWeight:700,textTransform:"uppercase",letterSpacing:".5px",marginBottom:"4px"}}>Variables (tap to toggle)</div>
                    <div style={{display:"flex",gap:"4px",flexWrap:"wrap"}}>
                      {data.vars.map(v=><Pill key={v} active={selVars.includes(v)}
                        onClick={()=>setSelVars(p=>p.includes(v)?p.filter(x=>x!==v):[...p,v])}
                        label={v.replace("DISEASES ","D: ")}/>)}
                    </div>
                  </div>
                  <div style={{display:"flex",gap:"10px",flexWrap:"wrap",alignItems:"center"}}>
                    <div style={{display:"flex",alignItems:"center",gap:"5px"}}>
                      <span style={{fontSize:"11px",color:"#475569"}}>Sort:</span>
                      <select value={sortV} onChange={e=>setSortV(e.target.value)}
                        style={{background:"#0f172a",border:"1px solid #334155",color:"#e2e8f0",borderRadius:"5px",padding:"3px 6px",fontSize:"11px"}}>
                        {data.vars.map(v=><option key={v} value={v}>{v}</option>)}
                      </select>
                    </div>
                    <label style={{display:"flex",alignItems:"center",gap:"5px",fontSize:"11px",cursor:"pointer"}}>
                      <input type="checkbox" checked={showNC} onChange={e=>setShowNC(e.target.checked)}/>
                      <span style={{color:"#94a3b8"}}>Show non-commercial</span>
                    </label>
                  </div>
                </div>

                {/* Site conditions card — shows when a specific site is selected */}
                {site!=="MEAN"&&data&&selId&&(
                  <SiteConditionCard key={site} siteCode={site} trialId={selId}/>
                )}

                {/* Compare strip */}
                {compared.length>0&&(
                  <div style={{background:"#0f2337",borderRadius:"9px",padding:"10px 12px",marginBottom:"9px",border:"1px solid #1e40af"}}>
                    <div style={{fontSize:"10px",fontWeight:700,color:"#60a5fa",marginBottom:"6px"}}>COMPARING {compared.length}</div>
                    <div style={{display:"flex",gap:"5px",flexWrap:"wrap",marginBottom:"8px"}}>
                      {compared.map(cn=>(
                        <span key={cn} style={{background:"#1e40af",color:"#fff",borderRadius:"5px",padding:"3px 8px",fontSize:"11px",display:"flex",alignItems:"center",gap:"4px"}}>
                          {cn}
                          <button onClick={()=>setCompared(p=>p.filter(x=>x!==cn))} style={{background:"none",border:"none",color:"#93c5fd",cursor:"pointer",fontSize:"14px",padding:0,lineHeight:1}}>x</button>
                        </span>
                      ))}
                      <button onClick={()=>setCompared([])} style={{background:"transparent",border:"1px solid #1e40af",color:"#60a5fa",borderRadius:"5px",padding:"3px 8px",fontSize:"11px",cursor:"pointer"}}>Clear</button>
                    </div>
                    <div style={{overflowX:"auto"}}>
                      <table style={{width:"100%",borderCollapse:"collapse",fontSize:"11px",minWidth:"280px"}}>
                        <thead>
                          <tr>
                            <th style={{textAlign:"left",padding:"4px 6px",color:"#475569",borderBottom:"1px solid #334155"}}>Cultivar</th>
                            {selVars.map(v=>{
                              const isActive=cmpSort.v===v;
                              const arr=isActive?(cmpSort.dir==="desc"?"▲":"▼"):"↕";
                              const onClick=()=>setCmpSort(p=>p.v===v?{v,dir:p.dir==="desc"?"asc":"desc"}:{v,dir:"desc"});
                              return <th key={v} onClick={onClick}
                                style={{textAlign:"center",padding:"4px 6px",color:isActive?"#22c55e":"#475569",borderBottom:"1px solid #334155",whiteSpace:"nowrap",cursor:"pointer",userSelect:"none"}}>
                                {cmpLabel(v)}{" "}
                                <span style={{fontSize:"14px",verticalAlign:"middle",color:isActive?"#22c55e":"#64748b"}}>{arr}</span>
                              </th>;
                            })}
                          </tr>
                        </thead>
                        <tbody>
                          {[...compared].sort((a,b)=>{
                      if(!cmpSort.v) return 0;
                      const ac=data.cultivars.find(x=>x.name===a);
                      const bc2=data.cultivars.find(x=>x.name===b);
                      const av=ac?.vars[cmpSort.v]?.[site]??ac?.vars[cmpSort.v]?.MEAN??-1;
                      const bv=bc2?.vars[cmpSort.v]?.[site]??bc2?.vars[cmpSort.v]?.MEAN??-1;
                      return cmpSort.dir==="desc"?bv-av:av-bv;
                    }).map(cn=>{
                            const c=data.cultivars.find(x=>x.name===cn);
                            if(!c) return null;
                            return (
                              <tr key={cn} style={{borderBottom:"1px solid #1e293b"}}>
                                <td style={{padding:"4px 6px",fontWeight:600,color:"#e2e8f0",fontSize:"10px"}}>{cn}</td>
                                {selVars.map(v=>{
                                  const val=c.vars[v]?.[site]??(site!=="MEAN"?c.vars[v]?.MEAN:null);
                                  const {r,total}=getRanks(data.cultivars,v,site);
                                  return (
                                    <td key={v} style={{padding:"4px 6px",textAlign:"center"}}>
                                      {val!=null?(
                                        <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:"2px"}}>
                                          <span style={{fontWeight:700,color:sc(val)}}>{val.toFixed(1)}</span>
                                          {total>0&&r[cn]&&<Rank rank={r[cn]} total={total}/>}
                                        </div>
                                      ):(
                                        <span style={{color:"#475569"}}>-</span>
                                      )}
                                    </td>
                                  );
                                })}
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}

                {/* Cultivar cards */}
                {filtered.length===0&&<div style={{textAlign:"center",padding:"40px",color:"#475569"}}>No cultivars match</div>}
                {filtered.map(c=><CultivarCard key={c.name} c={c}/>)}

                {/* Legend */}
                <div style={{marginTop:"10px",background:"#1e293b",borderRadius:"9px",padding:"9px",fontSize:"10px",color:"#475569"}}>
                  Ratings 1-9 (9=ideal).
                  {[["7+","Excellent","#22c55e"],["6-6.9","Good","#84cc16"],["5-5.9","Avg","#eab308"],["<5","Poor","#ef4444"]].map(([r,l,c])=>(
                    <span key={r} style={{marginLeft:"6px"}}><span style={{color:c}}>*</span> {r}={l}</span>
                  ))}
                  <br/>NC = non-commercial entry. Top Group = within LSD of leader.
                </div>
              </div>
            )}
          </div>
        )}

        {/* ═══ BY CULTIVAR ═══ */}
        {tab==="cultivar"&&(
          <div style={PAD}>
            <div style={{fontWeight:700,fontSize:"14px",color:"#fff",marginBottom:"3px"}}>Search all trials by cultivar</div>
            <div style={{fontSize:"11px",color:"#475569",marginBottom:"11px"}}>Searches across all cached trials</div>
            <input value={globQ} onChange={e=>setGlobQ(e.target.value)} placeholder="Type a cultivar name..."
              style={{width:"100%",background:"#1e293b",border:"1px solid #334155",color:"#e2e8f0",borderRadius:"8px",padding:"12px 13px",fontSize:"15px",outline:"none",boxSizing:"border-box",marginBottom:"11px"}}/>
            {globLoading&&(
              <div style={{textAlign:"center",color:"#475569",padding:"20px",fontSize:"12px"}}>Searching...</div>
            )}
            {!globLoading&&globQ.trim().length>=2&&globResults.length===0&&(
              <div style={{background:"#1e293b",borderRadius:"9px",padding:"20px",textAlign:"center",color:"#475569",fontSize:"12px"}}>
                No results for "{globQ}". This cultivar may not be in any cached trial.
              </div>
            )}
            {!globLoading&&globResults.map(r=>{
              const trialList=r.trials.map(tid=>TRIALS.find(t=>t.id===tid)).filter(Boolean);
              return (
                <div key={r.name} style={{background:"#1e293b",borderRadius:"9px",padding:"12px 13px",border:"1px solid #334155",marginBottom:"8px"}}>
                  <div style={{fontWeight:700,fontSize:"14px",color:"#f1f5f9",marginBottom:"2px"}}>{r.name}</div>
                  <div style={{fontSize:"10px",color:"#475569",marginBottom:"8px"}}>
                    {trialList.length>0?trialList[0].species:"Unknown"} — {r.trials.length} trial{r.trials.length!==1?"s":""}
                  </div>
                  {trialList.map(t=>{
                    const loaded=data?.trialId===t.id;
                    return (
                      <div key={t.id} style={{background:"#0f172a",borderRadius:"7px",padding:"8px 10px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:"7px",marginBottom:"4px"}}>
                        <div style={{flex:1,minWidth:0,fontSize:"12px",color:"#cbd5e1",fontWeight:600,overflowWrap:"break-word"}}>{t.label}</div>
                        <button onClick={()=>{go(t.id,false);setTab("trial");}}
                          style={{background:loaded?"#14532d":"#1e293b",border:"1px solid",borderColor:loaded?"#22c55e":"#334155",color:loaded?"#22c55e":"#94a3b8",borderRadius:"6px",padding:"6px 10px",fontSize:"11px",fontWeight:600,cursor:"pointer",flexShrink:0,whiteSpace:"nowrap"}}>
                          {loaded?"Loaded":"Load trial"}
                        </button>
                      </div>
                    );
                  })}
                </div>
              );
            })}
            {globQ.trim().length<2&&(
              <div style={{background:"#1e293b",borderRadius:"9px",padding:"13px"}}>
                <div style={{fontSize:"12px",color:"#64748b",lineHeight:"1.8",marginBottom:"11px"}}>
                  Search any cultivar across all cached trials. Results come from your Drive cache — load more trials to expand coverage.
                </div>
              </div>
            )}
          </div>
        )}

        {/* ═══ BY SPECIES ═══ */}
        {tab==="species"&&(
          <div style={PAD}>
            <div style={{fontWeight:700,fontSize:"14px",color:"#fff",marginBottom:"3px"}}>Browse by species</div>
            <div style={{fontSize:"11px",color:"#475569",marginBottom:"11px"}}>All trial generations for a species in one place.</div>
            {!selSp?(
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(148px,1fr))",gap:"6px"}}>
                {SPECIES.map(sp=>{
                  const count=TRIALS.filter(t=>t.species===sp).length;
                  return (
                    <button key={sp} onClick={()=>setSelSp(sp)}
                      style={{background:"#1e293b",border:"1px solid #334155",borderRadius:"9px",padding:"12px",textAlign:"left",cursor:"pointer",color:"#e2e8f0",display:"flex",flexDirection:"column",gap:"4px"}}>
                      <div style={{fontWeight:700,fontSize:"12px"}}>{sp}</div>
                      <div style={{fontSize:"10px",color:"#475569"}}>{count} trial{count!==1?"s":""}</div>
                    </button>
                  );
                })}
              </div>
            ):(
              <div>
                <button onClick={()=>setSelSp(null)} style={{background:"#1e293b",border:"1px solid #334155",color:"#94a3b8",borderRadius:"7px",padding:"6px 10px",cursor:"pointer",fontSize:"12px",marginBottom:"10px"}}>Back to all species</button>
                <div style={{fontWeight:700,fontSize:"15px",color:"#fff",marginBottom:"9px"}}>{selSp}</div>
                {TRIALS.filter(t=>t.species===selSp).map(t=>(
                  <button key={t.id} onClick={()=>{go(t.id);setTab("trial");}}
                    style={{width:"100%",background:"#1e293b",border:"1px solid #334155",color:"#e2e8f0",borderRadius:"7px",padding:"10px 12px",textAlign:"left",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",gap:"7px",fontSize:"12px",marginBottom:"4px"}}>
                    <span style={{flex:1}}>{t.label}</span>
                    <div style={{display:"flex",gap:"4px",alignItems:"center"}}>
                      {chas(t.id)&&<Tag text="cached" bg="#1e3a5f"/>}
                      <span style={{color:"#22c55e",fontSize:"11px"}}>Load</span>
                    </div>
                  </button>
                ))}
              </div>
            )}
          </div>
        )}

      </div>

      <footer style={{background:"#1e293b",borderTop:"1px solid #334155",padding:"6px 13px",fontSize:"10px",color:"#334155",textAlign:"center",flexShrink:0}}>
        Data (c) NTEP — 1-9 scale, 9=ideal — Not affiliated with NTEP or UMN
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
